name: Verify CIRCA portfolio design
on:
  push:
    branches: [feat/portfolio-redesign-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
